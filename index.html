<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Estaciones Policiales</title>
    <!-- Estilos básicos de Bootstrap para un diseño limpio -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">🚓 Estaciones Más Cercanas</h3>
                        
                        <div class="mb-3">
                            <label class="form-label">Latitud</label>
                            <input type="number" id="latInput" class="form-control" placeholder="Ej: 14.0818" step="any">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Longitud</label>
                            <input type="number" id="lonInput" class="form-control" placeholder="Ej: -87.1921" step="any">
                        </div>
                        
                        <button onclick="buscarEstaciones()" class="btn btn-primary w-100">Buscar</button>
                    </div>
                </div>

                <!-- Área de Resultados -->
                <div id="resultados" class="mt-4"></div>
            </div>
        </div>
    </div>

    <script>
        function buscarEstaciones() {
            const lat = document.getElementById('latInput').value;
            const lon = document.getElementById('lonInput').value;
            const resultadosDiv = document.getElementById('resultados');
            
            if (!lat || !lon) {
                resultadosDiv.innerHTML = '<div class="alert alert-warning" role="alert">Por favor ingresa ambas coordenadas.</div>';
                return;
            }

            // Cambia esta URL cuando despliegues tu API en la nube (Ej. en Render)
            const API_URL = `http://localhost:5000/estaciones?lat=${lat}&lon=${lon}&limite=3`;
            
            resultadosDiv.innerHTML = '<p class="text-center">Buscando...</p>';

            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        resultadosDiv.innerHTML = `<div class="alert alert-danger" role="alert">${data.error}</div>`;
                        return;
                    }

                    // Construir el HTML de los resultados
                    let html = '<h4 class="mb-3">Resultados (Las 3 más cercanas):</h4><ul class="list-group">';
                    data.forEach(estacion => {
                        html += `
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <strong>${estacion.nombre}</strong>
                                <span class="badge bg-success rounded-pill">${estacion.distancia_km} km</span>
                            </li>
                        `;
                    });
                    html += '</ul>';
                    resultadosDiv.innerHTML = html;
                })
                .catch(error => {
                    resultadosDiv.innerHTML = '<div class="alert alert-danger" role="alert">Error al conectar con la API. Verifica que esté encendida.</div>';
                    console.error("Error:", error);
                });
        }
    </script>
</body>
</html>
